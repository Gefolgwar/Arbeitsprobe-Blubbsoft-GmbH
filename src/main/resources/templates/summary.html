<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Zusammenfassung — ' + ${title}">Zusammenfassung</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Zusammenfassung</h1>
        <h2 th:text="${title}">Fragebogen</h2>

        <div th:if="${imported}" class="imported-badge">
            <strong>📥 Importierte Ergebnisse</strong>
            <span th:if="${exportedAt}" th:text="' (exportiert am ' + ${exportedAt} + ')'"></span>
        </div>

        <div th:if="${error}" class="error-message">
            <strong>Fehler:</strong> <span th:text="${error}">Fehlermeldung</span>
        </div>

        <div class="summary-list">
            <div th:each="result : ${results}" class="summary-item">
                <div class="summary-question">
                    <strong th:text="${result.questionText}">Frage</strong>
                    <span class="question-type" th:text="'(' + ${result.questionType} + ')'"></span>
                </div>
                <div class="summary-answer">
                    <div th:if="${result.questionType == 'MATRIX'}">
                        <ul>
                            <li th:each="answer : ${result.answers}" th:text="${answer}">Zeile: Wert</li>
                        </ul>
                    </div>
                    <div th:if="${result.questionType == 'MULTIPLE_CHOICE'}">
                        <span th:text="${result.displayAnswer}">Antworten</span>
                    </div>
                    <div th:if="${result.questionType == 'SINGLE_CHOICE'}">
                        <span th:text="${result.displayAnswer}">Antwort</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="summary-actions">
            <!-- Export -->
            <div th:unless="${imported}">
                <a href="/summary/export" class="btn btn-export">JSON speichern</a>
            </div>

            <!-- Import -->
            <form method="post" action="/summary/import" enctype="multipart/form-data" class="inline-form">
                <label for="file-upload" class="btn btn-import">JSON öffnen</label>
                <input id="file-upload" type="file" name="file" accept=".json" style="display:none;"
                       onchange="this.form.submit();">
            </form>

            <!-- Restart -->
            <form method="post" action="/survey/restart" class="inline-form">
                <button type="submit" class="btn btn-warning">Neu starten</button>
            </form>
        </div>
    </div>
</body>
</html>
